<nz-page-header nzTitle="选择名字空间" [nzGhost]="false">
<!--  <nz-breadcrumb [nzAutoGenerate]="true" nz-page-header-breadcrumb></nz-breadcrumb>-->
</nz-page-header>

<div style="padding: 20px 20px">
  <nz-card>
    <nz-space>
      @for (ns of namespaces; track ns.namespace) {
        <div *nzSpaceItem>
          <div (click)="select(ns)" class="selector">{{ ns.namespace }} ({{ ns.description.get('zh-CN') }})</div>
        </div>
      }
    </nz-space>
  </nz-card>
</div>
