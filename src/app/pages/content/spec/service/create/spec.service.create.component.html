<nz-spin [nzSpinning]="loadingProperties || loadingActions || loadingEvents">
  <nz-page-header (nzBack)="location.back()" nzBackIcon [nzTitle]="title" [nzSubtitle]="subTitle" [nzGhost]="false">
    <nz-breadcrumb [nzAutoGenerate]="true" nz-page-header-breadcrumb></nz-breadcrumb>
  </nz-page-header>

  <ng-template #title>
    {{ '创建服务' | translate }}
  </ng-template>

  <ng-template #subTitle>
    {{ account.ns.namespace }}
  </ng-template>

  <div style="padding: 20px 20px">
    <nz-card nzBorderless nzSize="small">
      <form nz-form [formGroup]="form"  (ngSubmit)="submitForm()">
        <nz-form-item>
          <nz-form-label [nzSpan]="4" nzRequired nzFor="code">代码</nz-form-label>
          <nz-form-control [nzSpan]="10" [nzErrorTip]="codeErrorTip">
            <spec-code formControlName="code" [updatable]="true"></spec-code>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="4" nzRequired nzFor="uuid">UUID</nz-form-label>
          <nz-form-control [nzSpan]="10" nzErrorTip="请输入UUID">
            <uuid formControlName="uuid"/>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="4" nzRequired nzFor="model">描述</nz-form-label>
          <nz-form-control [nzSpan]="10" nzErrorTip="描述">
            <description formControlName="description"/>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="4" nzRequired>必选属性</nz-form-label>
          <nz-form-control [nzSpan]="10">
            <service-definition-properties formControlName="requiredProperties" [properties]="properties"></service-definition-properties>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="4" nzRequired>可选属性</nz-form-label>
          <nz-form-control [nzSpan]="10">
            <service-definition-properties formControlName="optionalProperties" [properties]="properties"></service-definition-properties>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="4" nzRequired>必选方法</nz-form-label>
          <nz-form-control [nzSpan]="10">
            <service-definition-actions formControlName="requiredActions" [actions]="actions"></service-definition-actions>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="4" nzRequired>可选方法</nz-form-label>
          <nz-form-control [nzSpan]="10">
            <service-definition-actions formControlName="optionalActions" [actions]="actions"></service-definition-actions>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="4" nzRequired>必选事件</nz-form-label>
          <nz-form-control [nzSpan]="10">
            <service-definition-events formControlName="requiredEvents" [events]="events"></service-definition-events>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="4" nzRequired>可选事件</nz-form-label>
          <nz-form-control [nzSpan]="10">
            <service-definition-events formControlName="optionalEvents" [events]="events"></service-definition-events>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="4" nzRequired nzFor="lifecycle">状态</nz-form-label>
          <nz-form-control [nzSpan]="10" nzErrorTip="状态">
            <lifecycle formControlName="lifecycle" [updatable]="true"/>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-control [nzSpan]="4" [nzOffset]="4">
            <button nz-button nzType="primary" [disabled]="form.invalid || !form.dirty">提交</button>
          </nz-form-control>
        </nz-form-item>
      </form>
    </nz-card>
  </div>
</nz-spin>

<ng-template #codeErrorTip>
  @if (form.get('code')?.errors?.['required']) {
    <span>请输入代码</span>
  }
  @if (form.get('code')?.errors?.['pattern']) {
    <span>代码必须以字母开头，可包含字母、数字、中划线</span>
  }
</ng-template>
