<nz-page-header nzTitle="语言" [nzGhost]="false">
  <nz-breadcrumb [nzAutoGenerate]="true" nz-page-header-breadcrumb></nz-breadcrumb>
</nz-page-header>

<div style="padding: 20px 20px">
  <nz-card>
    <nz-space>
      @for (lang of i18n.languages; track lang.code) {
        <div *nzSpaceItem>
          <div (click)="changeLanguage(lang.code)" class="selector">{{ lang.name }}</div>
        </div>
      }
    </nz-space>
  </nz-card>
</div>
