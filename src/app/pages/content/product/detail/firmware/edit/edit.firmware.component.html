<div style="width: 100%">
  <form nz-form [formGroup]="form">
    <nz-form-item>
      <nz-form-label [nzSpan]="6" nzRequired>固件名称</nz-form-label>
      <nz-form-control [nzSpan]="14" >
        <product-firmware-name formControlName="name"/>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="6" nzRequired>固件描述</nz-form-label>
      <nz-form-control [nzSpan]="14">
        <input nz-input formControlName="description"/>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="6" nzRequired>固件类型</nz-form-label>
      <nz-form-control [nzSpan]="14">
        <product-firmware-type formControlName="type"/>
      </nz-form-control>
    </nz-form-item>
  </form>
</div>
