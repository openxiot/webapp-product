<nz-card nzSize="small" class="group" [nzBodyStyle]="{ padding: 0}" nzBorderless>
  <div class="group-bar">
    <nz-space class="group-title">
      <span *nzSpaceItem><span nz-icon nzType="appstore" nzTheme="outline"></span></span>
      <span *nzSpaceItem>{{ '服务' | translate }}({{ services.length }})</span>
    </nz-space>

    @if (editable) {
      <span style="float: right">
        <div class="selector" (click)="onAddService()">
          <span nz-icon nzType="plus" nzTheme="outline"></span>
        </div>
      </span>
    }
  </div>

  <ul nz-menu nzMode="inline" nzTheme="light" class="service-group">
    @for (s of services; track s.iid) {
      <li nz-menu-item (click)="onClickService(s)">
        <nz-tag [nzColor]="'blue'">{{ s.iid }}</nz-tag>
        <span class="service-title">{{ s.description.get(i18n.getCurrentLang()) }}</span>

        <span style="float: right">
<!--          @if (s.required) {-->
<!--            <nz-tag nzColor="blue">{{ '必选' | translate }}</nz-tag>-->
<!--          } @else {-->
<!--            <nz-tag nzColor="green">{{ '可选' | translate }}</nz-tag>-->
<!--          }-->

          @if (showVersion) {
            <nz-tag nzColor="blue">{{ '版本' | translate }} {{ s.type.version }}</nz-tag>
          }
        </span>
      </li>
    }
  </ul>
</nz-card>
