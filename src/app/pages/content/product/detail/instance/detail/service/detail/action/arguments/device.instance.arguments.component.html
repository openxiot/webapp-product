<nz-row [nzGutter]="[8, 8]">

  @for (arg of arguments(); track arg.piid) {
    <nz-col [nzSpan]="24">
      <nz-row [nzGutter]="[8, 8]">
        <div nz-col [nzSpan]="6">
          <nz-input-wrapper [nzAddonBefore]="arg.piid.toString()">
            <input nz-input [ngModel]="getDescription(arg)" [disabled]="true"/>
          </nz-input-wrapper>
        </div>

        <nz-col [nzSpan]="15">
          <nz-space nzDirection="horizontal">
            <nz-input-number *nzSpaceItem [nzAddonBefore]="'最少' | translate" [nzAddonAfter]="'次' | translate" [(ngModel)]="arg.minRepeat" (ngModelChange)="onChanged()" [nzDisabled]="lifecycle !== LifeCycle.DEVELOPMENT"></nz-input-number>

            <nz-input-number *nzSpaceItem [nzAddonBefore]="'最多' | translate" [nzAddonAfter]="'次' | translate" [(ngModel)]="arg.maxRepeat" (ngModelChange)="onChanged()" [nzDisabled]="lifecycle !== LifeCycle.DEVELOPMENT"></nz-input-number>
          </nz-space>
        </nz-col>

        @if (lifecycle === LifeCycle.DEVELOPMENT) {
          <nz-col [nzSpan]="1">
            <button nz-button nzType="dashed" nzDanger (click)="removeArgument(arg)" style="width: 40px" type="button">
              <span nz-icon nzType="delete"></span>
            </button>
          </nz-col>
        }
      </nz-row>
    </nz-col>
  }

  @if (lifecycle === LifeCycle.DEVELOPMENT) {
    <nz-col [nzSpan]="24">
      <button nz-button nzType="dashed" (click)="addArgument()" style="width: 100px" type="button">
        <span nz-icon nzType="plus"></span>
      </button>
    </nz-col>
  }
</nz-row>
