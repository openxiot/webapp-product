@switch (lifecycle) {
  @case (LifeCycle.DEVELOPMENT) {
    <nz-cascader [nzOptions]="nzOptions" [(ngModel)]="value"></nz-cascader>
  }
  @case (LifeCycle.PREVIEW) {
    <nz-tag nzColor="green">{{ protocolCategory }}</nz-tag>
    <nz-tag nzColor="blue">{{ protocolName }}</nz-tag>
  }
  @case (LifeCycle.RELEASED) {
    <nz-tag nzColor="green">{{ protocolCategory }}</nz-tag>
    <nz-tag nzColor="blue">{{ protocolName }}</nz-tag>
  }
}
