<nz-row [nzGutter]="[8, 8]">

  @for (item of value; track item) {
    <nz-col [nzSpan]="24">
      <div style="display: flex; gap: 8px; align-items: center;">
        <input
          type="text"
          nz-input
          [ngModel]="item.value.get(i18n.getCurrentLang())"
          [disabled]="! updatable"
          (ngModelChange)="onValueChanged($event, item)"
        />

        <button type="button" nz-button nzType="text" nzDanger (click)="removeItem(item)">
          <span nz-icon nzType="delete"></span>
        </button>
      </div>
    </nz-col>
  }

  @if (updatable) {
    <nz-col [nzSpan]="24">
      <button type="button" nz-button nzType="dashed" (click)="addItem()">
        <span nz-icon nzType="plus"></span> {{ '添加' | translate }}
      </button>
    </nz-col>
  }
</nz-row>
