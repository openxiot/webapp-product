<nz-card
  nzSize="small"
  [nzTitle]="'设备' | translate"
  [nzExtra]="extra"
>
  @for (type of types; track type.code) {
    <nz-tag nzMode="checkable" [(nzChecked)]="type.checked" (nzCheckedChange)="onTypeChecked(type, $event)">{{ type.name }}</nz-tag>
  }
</nz-card>

<ng-template #extra>
  <nz-tag nzMode="checkable" [(nzChecked)]="all.checked" (nzCheckedChange)="onAllChecked(all, $event)">{{ all.name | translate }}</nz-tag>
</ng-template>
