@if (service) {
  <nz-layout class="inner-layout">
    <nz-sider nzWidth="360px" nzTheme="light">
      <template-service-card
        [showVersion]="showVersion"
        [editable]="editable"
        [service]="service"
        (changed)="onChanged()"
        (titleSelected)="onTitleSelected($event)"
        (propertySelected)="onPropertySelected($event)"
        (actionSelected)="onActionSelected($event)"
        (eventSelected)="onEventSelected($event)"
      ></template-service-card>
    </nz-sider>

    <nz-content class="inner-content">
      @if (showServiceDetail) {
        <template-service-detail
          [editable]="editable"
          [service]="service"
          (changed)="onChanged()"
          (removed)="onRemoved()"
        ></template-service-detail>
      }

      @if (property) {
        <template-property-detail
          [editable]="editable"
          [service]="service"
          [property]="property"
          (changed)="onChanged()"
          (removed)="onPropertyRemoved($event)"
        ></template-property-detail>
      }

      @if (action) {
        <template-action-detail
          [editable]="editable"
          [service]="service"
          [action]="action"
          (changed)="onChanged()"
          (removed)="onActionRemoved($event)"
        ></template-action-detail>
      }

      @if (event) {
        <template-event-detail
          [editable]="editable"
          [service]="service"
          [event]="event"
          (changed)="onChanged()"
          (removed)="onEventRemoved($event)"
        ></template-event-detail>
      }
    </nz-content>
  </nz-layout>
}
