<div nz-row [nzGutter]="[8, 8]">
  <div nz-col [nzSpan]="6" class="argument">
    <span>
      <nz-tag nzColor="blue">{{ value.property.iid }}</nz-tag>
    </span>

    <span>
      {{ value.property.description.get(value.language) }}
    </span>
  </div>

  <div nz-col [nzSpan]="16">
    <nz-space nzDirection="horizontal">
      <nz-input-number *nzSpaceItem [nzAddonBefore]="'最少' | translate" [nzAddonAfter]="'次' | translate" [(ngModel)]="value.argument.minRepeat" (ngModelChange)="onChanged()"></nz-input-number>

      <nz-input-number *nzSpaceItem [nzAddonBefore]="'最多' | translate" [nzAddonAfter]="'次' | translate" [(ngModel)]="value.argument.maxRepeat" (ngModelChange)="onChanged()"></nz-input-number>
    </nz-space>
  </div>
</div>
