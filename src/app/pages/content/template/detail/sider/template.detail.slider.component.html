@if (template) {
  <nz-layout class="inner-layout">
    <nz-sider nzWidth="360px" nzTheme="light">
      <template-detail-services
        [editable]="editable"
        [device]="template"
        (selected)="onServiceSelected($event)"
        (changed)="onChanged()"
      ></template-detail-services>
    </nz-sider>

    <nz-content class="inner-content">
      @if (service) {
<!--        <nz-card nzTitle="这是一个服务卡片" [nzBodyStyle]="{ padding: 4 }">-->
<!--          <template-service-split-->
<!--            [editable]="editable"-->
<!--            [service]="service"-->
<!--          ></template-service-split>-->
<!--        </nz-card>-->
        @if (expert) {
          <template-service-waterfall
            [editable]="editable"
            [service]="service"
          ></template-service-waterfall>
        } @else {
          <template-service-split
            [editable]="editable"
            [service]="service"
          ></template-service-split>
        }
      }
    </nz-content>
  </nz-layout>
}
