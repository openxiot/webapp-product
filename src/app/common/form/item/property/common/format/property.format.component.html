@if (updatable) {
  <nz-select [ngModel]="_value" (ngModelChange)="onSelectionChange($event)">
    @for (item of formats; track item) {
      <nz-option
        [nzValue]="item.type.name"
        nzLabel="{{ item.type.name }} ({{ item.description.get('zh-CN') || item.description.get('en-US') }})"
      ></nz-option>
    }
  </nz-select>
} @else {
  <span class="format-display" [class.disabled]="isDisabled">
    {{ selectedLabel }}
    @if (isDisabled) {
      <span class="disabled-hint">(已禁用)</span>
    }
  </span>
}
