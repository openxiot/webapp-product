@if (updatable) {
  <label nz-checkbox [(ngModel)]="_value().isReadable" (ngModelChange)="onReadableChanged($event)">{{ '读' | translate }}</label>
  <label nz-checkbox [(ngModel)]="_value().isWritable" (ngModelChange)="onWritableChanged($event)">{{ '写' | translate }}</label>
  <label nz-checkbox [(ngModel)]="_value().isNotifiable" (ngModelChange)="onNotifiableChanged($event)">{{ '通知' | translate }}</label>
} @else {
  <nz-space>
    @if (_value().isReadable) {
      <div *nzSpaceItem>
        <nz-tag nzColor="green">{{ '读' | translate }}</nz-tag>
      </div>
    }

    @if (_value().isWritable) {
      <div *nzSpaceItem>
        <nz-tag nzColor="red">{{ '写' | translate }}</nz-tag>
      </div>
    }

    @if (_value().isNotifiable) {
      <div *nzSpaceItem>
        <nz-tag nzColor="blue">{{ '通知' | translate }}</nz-tag>
      </div>
    }
  </nz-space>
}
