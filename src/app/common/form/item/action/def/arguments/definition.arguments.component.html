<nz-row [nzGutter]="[8, 8]">

  @for (arg of arguments; track arg) {
    <nz-col [nzSpan]="24">
      <nz-row [nzGutter]="[8, 8]">
        <nz-col [nzSpan]="6">
          <nz-input-group [nzAddOnBefore]="arg.type.name">
            <input
              type="text"
              nz-input
              [ngModel]="getDescription(arg)"
              [disabled]="true"
            />
          </nz-input-group>
        </nz-col>

        <nz-col [nzSpan]="15">
          <nz-space nzDirection="horizontal">
            <nz-input-number *nzSpaceItem [nzAddonBefore]="'最少' | translate" [nzAddonAfter]="'次' | translate" [(ngModel)]="arg.minRepeat" (ngModelChange)="onChanged()" [nzDisabled]="!updatable"></nz-input-number>

            <nz-input-number *nzSpaceItem [nzAddonBefore]="'最多' | translate" [nzAddonAfter]="'次' | translate" [(ngModel)]="arg.maxRepeat" (ngModelChange)="onChanged()" [nzDisabled]="!updatable"></nz-input-number>
          </nz-space>
        </nz-col>

        @if (updatable) {
          <nz-col [nzSpan]="1">
            <button nz-button nzType="dashed" nzDanger (click)="removeArgument(arg)" style="width: 40px" type="button">
              <span nz-icon nzType="delete"></span>
            </button>
          </nz-col>
        }
      </nz-row>
    </nz-col>
  }

  @if (updatable) {
    <nz-col [nzSpan]="24">
      <button nz-button nzType="dashed" (click)="addArgument()" style="width: 100px" type="button">
        <span nz-icon nzType="plus"></span>
      </button>
    </nz-col>
  }
</nz-row>
