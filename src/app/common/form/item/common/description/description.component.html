@if (updatable) {
  @if (multiple) {
    <nz-row [nzGutter]="[8, 8]">
      @for (item of langList; track item.lang; let i = $index) {
        <nz-col [nzSpan]="24">
          <div style="display: flex; gap: 8px; align-items: center;">
            <nz-input-wrapper nzAddonBefore="{{ item.label | translate }}" style="flex: 1;">
              <input
                type="text"
                nz-input
                [(ngModel)]="item.value"
                (ngModelChange)="emitChange()"
              />
            </nz-input-wrapper>

            <button type="button" nz-button nzType="text" nzDanger (click)="removeLang(i)"
                    [disabled]="item.lang === 'en-US'">
              <span nz-icon nzType="delete"></span>
            </button>
          </div>
        </nz-col>
      }

      <nz-col [nzSpan]="24">
        <button type="button" nz-button nzType="dashed" (click)="addLang()" [disabled]="isDisabled">
          <span nz-icon nzType="plus"></span> {{ '添加语言描述' | translate }}
        </button>
      </nz-col>
    </nz-row>
  } @else {
    @if (prefix) {
      <nz-input-wrapper [nzAddonBefore]=" '描述' | translate " style="flex: 1;">
        <input
          type="text"
          nz-input
          [(ngModel)]="CurrentLangValue"
        />
      </nz-input-wrapper>
    } @else {
      <input
        type="text"
        nz-input
        [(ngModel)]="CurrentLangValue"
      />
    }
  }
} @else {
  @if (prefix) {
    <nz-input-wrapper [nzAddonBefore]=" '描述' | translate " style="flex: 1;">
      <input
        type="text"
        nz-input
        [ngModel]="CurrentLangValue"
        [disabled]="true"
      />
    </nz-input-wrapper>
  } @else {
    <input
      type="text"
      nz-input
      [ngModel]="CurrentLangValue"
      [disabled]="true"
    />
  }
}
