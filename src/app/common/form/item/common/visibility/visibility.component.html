@if (lifecycle === LifeCycle.DEVELOPMENT) {
  <nz-radio-group [ngModel]="value" nzButtonStyle="solid" (ngModelChange)="onRadioChange($event)">
    <label nz-radio-button [nzValue]="Visibility.PUBLIC">公开</label>
    <label nz-radio-button [nzValue]="Visibility.PRIVATE">私有</label>
  </nz-radio-group>
} @else {
  @switch (value) {
    @case (Visibility.PUBLIC) {
      <nz-tag nzColor="blue">公开</nz-tag>
    }
    @case (Visibility.PRIVATE) {
      <nz-tag nzColor="green">私有</nz-tag>
    }
  }
}
