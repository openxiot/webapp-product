<nz-spin [nzSpinning]="loading">

  <nz-row [nzGutter]="[8, 8]">
    @for (ns of namespaces; track ns.namespace) {
      <nz-col [nzSpan]="6" (click)="changeNamespace(ns)">
        <nz-card nzHoverable>
          <nz-card-meta [nzTitle]="title" [nzDescription]="desc"></nz-card-meta>
        </nz-card>
      </nz-col>

      <ng-template #title>
        <span>
          <span>{{ ns.namespace }}</span>

          @if (account.ns) {
            @if (ns.namespace === account.ns.namespace) {
              <span style="float: right">
              <span nz-icon nzType="check" nzTheme="outline"></span>
            </span>
            }
          }
        </span>
      </ng-template>

      <ng-template #desc>
        {{ ns.description.get('zh-CN') }}
      </ng-template>
    }
  </nz-row>
</nz-spin>
