<nz-spin [nzSpinning]="loading || loadingProperties">
  <nz-layout class="inner-layout">
    <nz-sider nzWidth="200px" nzTheme="light" class="sider">
      <ul nz-menu nzMode="inline" nzTheme="light">
        <li nz-menu-item (click)="onClickEvent(custom)">
          <span class="action-title">{{ custom.description.get(i18n.getCurrentLang()) }}</span>
        </li>

        <li nz-menu-divider></li>

        @for (s of events; track s.type.name) {
          <li nz-menu-item (click)="onClickEvent(s)">
            <span class="action-title">{{ s.description.get(i18n.getCurrentLang()) }}</span>
          </li>
        }
      </ul>
    </nz-sider>

    <nz-content class="inner-content">
      <div style="width: 100%">
        <form nz-form [formGroup]="form">
          <nz-form-item nz-flex>
            <nz-form-label [style.width.px]="120" nzRequired>{{ '实例ID' | translate }}</nz-form-label>
            <nz-form-control>
              <device-instance-id
                formControlName="iid"
                [lifecycle]="LifeCycle.PREVIEW"
                (changed)="onIIDChanged()"
              ></device-instance-id>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item nz-flex>
            <nz-form-label [style.width.px]="120" nzRequired>{{ '名字空间' | translate }}</nz-form-label>
            <nz-form-control>
              <device-instance-namespace formControlName="ns"></device-instance-namespace>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item nz-flex>
            <nz-form-label [style.width.px]="120" nzRequired>{{ '代码' | translate }}</nz-form-label>
            <nz-form-control>
              <device-instance-name
                formControlName="code"
                [lifecycle]="form.controls.ns.value === option.type.organization ? LifeCycle.DEVELOPMENT : LifeCycle.PREVIEW"
                [updatable]="true"
                (changed)="onCodeChanged()"
              ></device-instance-name>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item nz-flex>
            <nz-form-label [style.width.px]="120" nzRequired>{{ '描述' | translate }}</nz-form-label>
            <nz-form-control>
              <description
                formControlName="description"
                [updatable]="true"
                [multiple]="true"
                [candidate]="selected.description"
                (changed)="onDescriptionChanged()"
              ></description>
            </nz-form-control>
          </nz-form-item>
        </form>
      </div>
    </nz-content>
  </nz-layout>
</nz-spin>
