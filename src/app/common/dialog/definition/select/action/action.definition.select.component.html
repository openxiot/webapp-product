<div style="width: 100%">
  <nz-table
    style="width: 100%"
    #table
    [nzData]="actions"
    [nzSize]="'small'"
    [nzPageSize]="100"
    [nzHideOnSinglePage]="true"
    [nzBordered]="true"
  >
    <thead>
    <tr>
      <th
        [(nzChecked)]="checked"
        [nzIndeterminate]="indeterminate"
        (nzCheckedChange)="onAllChecked($event)"
      ></th>
      <th>{{ '代码' | translate }}</th>
      <th>{{ '描述' | translate }}</th>
      <th>{{ '参数' | translate }}</th>
      <th>{{ '返回值' | translate }}</th>
    </tr>
    </thead>
    <tbody>
      @for (p of table.data; track p) {
        <tr>
          <td [nzChecked]="selected.has(p)" (nzCheckedChange)="onItemChecked(p, $event)"></td>
          <td nzAlign="center">
            <nz-tag [nzColor]="'blue'">{{ p.type.name }}</nz-tag>
          </td>
          <td>
            {{ p.description.get(data.language) }}
          </td>
          <td>
            @for (arg of p.in; track arg) {
              {{ arg.type.name}}
            }
          </td>
          <td>
            @for (arg of p.out; track arg) {
              {{ arg.type.name}}
            }
          </td>
        </tr>
      }
    </tbody>
  </nz-table>
</div>
